name: Best Buy
domain: bestbuy.com
websiteUrl: https://www.bestbuy.com/
status: published
categories: [electronics-tech]
tagline: Consumer-electronics retailer with free shipping at $35 and a free membership tier that removes the minimum.
overview: |-
  Best Buy is a specialist in consumer electronics and appliances, with stores across the US and a growing online marketplace of third-party sellers. Return windows at Best Buy are shorter than at most general retailers and depend on your membership tier, so the return policy deserves a look before a big purchase.

  Shipping is simpler: standard shipping is free above a modest order total, and members of the free My Best Buy program get free standard shipping with no minimum. Large items such as major appliances and big TVs follow separate delivery terms.
tips:
  - Sign in with a free My Best Buy account before checkout if your order is under the shipping minimum.
  - Marketplace items are sold by outside sellers and do not get the same shipping or extended return benefits.
  - Activatable devices such as phones have the shortest return window. Decide quickly whether to keep them.
facts:
  - label: Free shipping
    short: Free shipping on $35+
    value: Standard shipping is free on orders of $35 and up (after coupons, before tax). My Best Buy members get free standard shipping with no minimum. Marketplace items are excluded.
    sourceUrl: https://www.bestbuy.com/site/help-topics/free-shipping/pcmcat276800050002.c?id=pcmcat276800050002
    checkedAt: 2026-10-16
  - label: Standard returns
    short: 15-day standard returns
    value: Most products have a 15-day return window. My Best Buy Plus and Total members get 60 days; activatable devices have 14 days.
    sourceUrl: https://www.bestbuy.com/site/help-topics/return-exchange-policy/pcmcat260800050014.c?id=pcmcat260800050014
    checkedAt: 2026-10-16

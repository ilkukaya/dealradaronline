tagline: Music and podcast streaming service with a discounted Premium plan for college students that includes Hulu.
overview: |-
  Spotify offers a free, ad-supported tier and several paid Premium plans. For US college students, Premium Student is the plan to look at: it costs less than the individual plan and currently bundles the ad-supported Hulu plan.

  Student pricing is not permanent. Spotify asks students to re-verify their enrollment periodically and limits how long the discount lasts, after which the account moves to the regular individual price unless you change plans.
tips:
  - Free-trial eligibility usually depends on whether you have tried Premium before on that account.
  - If you already pay Hulu directly, read Spotify's instructions on switching billing before you sign up for the bundle.
  - Note the date your student eligibility ends so the price change does not surprise you.

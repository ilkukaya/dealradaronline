categories: [software-digital]
tagline: Amazon's audiobook service, with a free trial for new members before the monthly plan begins.
overview: |-
  Audible sells audiobooks individually and through membership plans. The main plan gives members a monthly credit that can be exchanged for one title, plus access to a catalog of included titles at no extra cost.

  New members can usually start with a free trial. The trial renews into a paid monthly plan automatically, so it is best used deliberately: pick the title you want with the trial credit, then decide whether you will use a credit every month before the paid plan starts.
tips:
  - Credits are worth the most on long or expensive titles. Check a title's regular price before spending a credit on it.
  - Cancel before the trial ends if you do not want the paid plan. Read Audible's terms on what happens to unused credits when you cancel.

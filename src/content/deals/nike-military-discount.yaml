title: "Nike military discount: 10% off most items online and in stores"
merchant: nike
category: fashion
offerType: military
description: Active, reservist, veteran, and retired US military personnel — and spouses and dependents of active personnel — get 10% off most items at Nike.
editorialSummary: |-
  Nike's military discount covers most products on Nike.com and in Nike stores, which makes it a dependable saving on running shoes and training gear that rarely go on deep sale.

  It applies to most items rather than everything, and Nike's discount programs generally cannot be combined with other promo codes. Check the final price in your cart before you order.

offerType: student
description: Verified students at eligible colleges and universities can get YouTube Premium, including YouTube Music Premium, for $8.99 a month after a one-month trial.
editorialSummary: |-
  YouTube Premium removes ads, adds downloads and background play, and includes YouTube Music Premium. The student plan is the lowest-priced way to get all of that if you are enrolled at an eligible school.

  Verification is annual and the student rate is limited to four years. If you already pay for YouTube Premium, you need to cancel your current plan before switching, so time it with the end of your billing period.
eligibility: Students at higher-education institutions approved by YouTube's verification partner (SheerID).
restrictions:
  - The trial is for eligible new members only, generally one per payment method.
  - Annual re-verification is required; the student plan is available for up to four years.
  - Existing paid YouTube members must cancel before switching to the student plan.

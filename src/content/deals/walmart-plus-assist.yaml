title: "Walmart+ Assist: Walmart+ at 50% off for government assistance recipients"
merchant: walmart
category: memberships
offerType: assistance
description: People who receive SNAP, WIC, Medicaid, SSI, TANF, or other qualifying benefits can get Walmart+ for $6.47 a month or $49 a year — half the regular price.
editorialSummary: |-
  Walmart+ Assist cuts the membership price in half for households already enrolled in qualifying federal assistance programs. If you shop at Walmart regularly and use delivery or pickup, the reduced membership can pay for itself quickly through waived delivery fees.

  Verification runs through a third-party service. Walmart notes that the program's availability, qualifications, and discount can change, so confirm the current terms on Walmart's page before signing up.
eligibility: Recipients of SNAP, WIC, Medicaid, SSI, TANF, TTANF, NSLP, or LIHEAP.
restrictions:

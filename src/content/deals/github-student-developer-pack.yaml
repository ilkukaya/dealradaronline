description: Students aged 13 and older in a degree- or diploma-granting program can claim a free bundle of developer tools and partner offers from GitHub Education.
editorialSummary: |-
  If you are learning to code, the Student Developer Pack is worth claiming before almost anything else on this list: it costs nothing and bundles offers from GitHub and many partner companies, from cloud credits to domain names and learning platforms.

  The pack's contents change over time and each partner sets its own terms — some offers expire or need renewal. Activate only the offers you plan to use, and note their end dates.
